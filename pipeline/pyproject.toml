[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "comics-pipeline"
version = "0.1.0"
description = "ETL for comics-market-dashboard: audit, catalog, build-data"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "pyarrow>=15",
  "duckdb>=1.0",
  "requests>=2.31",
  "openpyxl>=3.1",
  "truststore>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["comics_pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
