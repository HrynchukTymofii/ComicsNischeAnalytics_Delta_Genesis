[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "comics-mcp"
version = "0.1.0"
description = "MCP server exposing comics-market-dashboard processed data"
requires-python = ">=3.11"
dependencies = ["mcp[cli]>=1.2,<2", "duckdb>=1.0"]

[tool.setuptools.packages.find]
include = ["comics_mcp*"]
